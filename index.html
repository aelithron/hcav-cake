<!DOCTYPE html>
<html lang="en">

<head>
  <title>HCAV Cake :3</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="index.js" defer></script>
</head>

<body class="flex flex-col min-h-screen p-8 md:p-20 text-center">
  <h1 class="font-semibold text-xl">HCAV Cake</h1>
  <div class="grid grid-cols-4 align-middle items-center mx-auto lg:mt-20 mt-21">
    <div class="flex col-span-4">
      <p class="absolute animate-pulse text-xl left-104.5 lg:left-179.5 top-14 lg:top-25 z-2">🔥</p>
      <div class="absolute text-center border-x-1 border-black bg-red-500 w-5 h-16 left-105 lg:left-180 top-20 lg:top-31 z-1"></div>
      <p class="absolute animate-pulse text-xl left-124.5 lg:left-199.5 top-14 lg:top-25 z-2">🔥</p>
      <div class="absolute text-center border-x-1 border-black bg-red-500 w-5 h-16 left-125 lg:left-200 top-20 lg:top-31 z-1"></div>
      <p class="absolute animate-pulse text-xl left-144.5 lg:left-219.5 top-14 lg:top-25 z-2">🔥</p>
      <div class="absolute text-center border-x-1 border-black bg-red-500 w-5 h-16 left-145 lg:left-220 top-20 lg:top-31 z-1"></div>
    </div>

    <p>Sprinkles:</p>
    <div class="border-t-2 border-x-2 border-black h-15 w-150 col-span-3">
      <img src="assets/sprinkles.webp" alt="sprinkles" class="object-top object-cover h-15 w-150" height="15" width="150">
    </div>

    <p>Frosting:</p>
    <div class="border-t-2 border-x-2 border-black h-15 w-150 col-span-3">
      <img src="assets/frosting.webp" alt="frosting" class="object-center object-cover h-15 w-150" height="15" width="150">
    </div>

    <p>Cake:</p>
    <div class="border-t-2 border-x-2 border-black h-15 w-150 col-span-3">
      <img src="assets/cake.webp" alt="funfetti cake" class="object-top object-cover h-15 w-150" height="15" width="150">
    </div>

    <p>Strawberries:</p>
    <div class="border-t-2 border-x-2 border-black h-15 w-150 col-span-3">
      <img src="assets/strawberries.webp" alt="strawberries" class="object-top object-cover h-15 w-150" height="15" width="150">
    </div>

    <p>Cake Gremlin:</p>
    <div class="relative overflow-hidden border-t-2 border-x-2 border-black h-15 w-150 col-span-3 bg-amber-100">
      <div class="absolute inset-0 flex items-center justify-center gap-3 bg-pink-200">
        <span class="text-4xl -rotate-12">🍰</span>
        <span class="rounded-full border-2 border-black bg-yellow-300 px-3 py-1 text-xs font-black rotate-3 shadow-[3px_3px_0_#000]">CAKE GREMLIN!</span>
        <span class="text-3xl rotate-12">🍒</span>
        <span class="absolute bottom-0 left-1/4 text-lg rotate-6">🧁</span>
        <span class="absolute top-0 right-1/4 text-lg -rotate-12">✨</span>
      </div>
      <p class="absolute right-1 top-0 z-5">🤖</p>
    </div>

    <p>Agentic Bakery:</p>
    <div class="relative overflow-hidden border-t-2 border-x-2 border-black h-15 w-150 col-span-3 bg-violet-300">
      <div class="absolute inset-0 flex items-center justify-center gap-2 px-2 text-purple-950">
        <span class="rounded-full border-2 border-black bg-lime-300 px-2 py-1 text-[10px] font-black -rotate-6">INPUT: CAKE</span>
        <span class="text-xl">🧠</span>
        <span class="rounded-lg border-2 border-black bg-orange-300 px-2 py-1 text-center text-[10px] font-black leading-none rotate-2 shadow-[3px_3px_0_#000]">BAKING<br>IN PROGRESS</span>
        <span class="text-xl">🍰</span>
        <span class="absolute right-8 top-1 text-[10px] font-black leading-none rotate-6">OUTPUT: YUM</span>
      </div>
      <p class="absolute right-1 top-0 z-5">🤖</p>
    </div>

    <p>AI-made Gradient:</p>
    <div id="ai-gradient" class="border-t-2 border-x-2 border-black h-15 w-150 col-span-3 bg-gradient-to-r from-cyan-300 via-purple-500 to-pink-400">
      <p class="flex justify-end z-5">🤖</p>
    </div>

    <p>Human-made Gradient:</p>
    <div id="human-gradient" class="border-t-2 border-x-2 border-black h-15 w-150 col-span-3 bg-gradient-to-r from-pink-300 to-rose-300"></div>

    <p>Cake Slices:</p>
    <div class="border-t-2 border-x-2 border-black h-15 w-150 col-span-3">
      <img src="assets/slices.webp" alt="cake slices" class="object-center object-cover h-15 w-150" height="15" width="150">
    </div>

    <p>never?</p>
    <div id="never" class="border-2 border-black h-15 w-150 col-span-3">
      <img src="assets/never.webp" alt="never?" class="object-top object-cover h-14 w-150" height="14" width="150">
    </div>
    <p></p>
  </div>
</body>

</html>
