<!DOCTYPE html>
<html lang="en">

<head>
  <title>HCAV Cake :3</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="index.js" defer></script>
</head>

<body class="flex flex-col min-h-screen p-8 md:p-20 text-center">
  <h1 class="font-semibold text-xl">HCAV Cake</h1>
  <div class="grid grid-cols-4 align-middle items-center mx-auto mt-20">
    <div class="flex col-span-4">
      <p class="absolute animate-pulse text-xl left-179.5 top-25 z-2">🔥</p>
      <div class="absolute text-center border-x-1 border-black bg-red-500 w-5 h-16 left-180 top-31 z-1"></div>
      <p class="absolute animate-pulse text-xl left-199.5 top-25 z-2">🔥</p>
      <div class="absolute text-center border-x-1 border-black bg-red-500 w-5 h-16 left-200 top-31 z-1"></div>
      <p class="absolute animate-pulse text-xl left-219.5 top-25 z-2">🔥</p>
      <div class="absolute text-center border-x-1 border-black bg-red-500 w-5 h-16 left-220 top-31 z-1"></div>
    </div>

    <p>Sprinkles:</p>
    <div class="border-t-2 border-x-2 border-black h-15 w-150 col-span-3">
      <img src="assets/sprinkles.webp" alt="sprinkles" class="object-top object-cover h-15 w-150" height="15" width="150">
    </div>

    <p>Frosting:</p>
    <div class="border-t-2 border-x-2 border-black h-15 w-150 col-span-3">
      <img src="assets/frosting.webp" alt="frosting" class="object-center object-cover h-15 w-150" height="15" width="150">
    </div>

    <p>Cake:</p>
    <div class="border-t-2 border-x-2 border-black h-15 w-150 col-span-3">
      <img src="assets/cake.webp" alt="funfetti cake" class="object-top object-cover h-15 w-150" height="15" width="150">
    </div>

    <p>Strawberries:</p>
    <div class="border-t-2 border-x-2 border-black h-15 w-150 col-span-3">
      <img src="assets/strawberries.webp" alt="strawberries" class="object-top object-cover h-15 w-150" height="15" width="150">
    </div>

    <p>(AI placeholder 1):</p>
    <div class="border-t-2 border-x-2 border-black h-15 w-150 col-span-3">
      <p class="flex justify-end z-5">🤖</p>
    </div>

    <p>(AI placeholder 2):</p>
    <div class="border-t-2 border-x-2 border-black h-15 w-150 col-span-3">
      <p class="flex justify-end z-5">🤖</p>
    </div>

    <p>AI-made Gradient:</p>
    <div id="ai-gradient" class="border-t-2 border-x-2 border-black h-15 w-150 col-span-3 bg-gradient-to-r from-cyan-300 via-purple-500 to-pink-400">
      <p class="flex justify-end z-5">🤖</p>
    </div>

    <p>Human-made Gradient:</p>
    <div id="human-gradient" class="border-t-2 border-x-2 border-black h-15 w-150 col-span-3 bg-gradient-to-r from-pink-300 to-rose-300"></div>

    <p>Cake Slices:</p>
    <div class="border-t-2 border-x-2 border-black h-15 w-150 col-span-3">
      <img src="assets/slices.webp" alt="cake slices" class="object-center object-cover h-15 w-150" height="15" width="150">
    </div>

    <p>never?</p>
    <div id="never" class="border-2 border-black h-15 w-150 col-span-3">
      <img src="assets/never.webp" alt="never?" class="object-top object-cover h-14 w-150" height="14" width="150">
    </div>
    <p></p>
  </div>
</body>

</html>
